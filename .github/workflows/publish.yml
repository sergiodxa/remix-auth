name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: "Publish to npm"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run exports

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          package-manager-cache: false

      # Trusted publishing uses the GitHub OIDC token. Setting NODE_AUTH_TOKEN
      # (including secrets.NPM_TOKEN) makes npm skip that exchange.
      - run: npm publish --access public
